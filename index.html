<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eebed2">
    <meta name="description" content="Lis-moi quand : des versets du Coran pour accompagner tes émotions.">
    <title>Lis-moi quand...</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="Muslim.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="playfair-display-text">
        <h1>
            As-salâm ‘alaykum !<br>
            Un message apaisant quand tu en as besoin ! ☺
        </h1>
        <h3>Une émotion, une couleur......</h3>
        <p>Clique sur une catégorie pour commencer</p>
        <div class="émotion">
            <div class="un">
                <i class="bi bi-chat-heart-fill" id="jaune" onclick="Choix('Joie')"><p class="mot">Joie</p></i>
                <i class="bi bi-chat-heart-fill" id="rose" onclick="Choix('Solitude')"><p class="mot">Solitude</p></i>
            </div>
            <div class="deux">
                <i class="bi bi-chat-heart-fill" id="orange" onclick="Choix('Anxiété')"><p class="mot">Anxiété</p></i>
                <i class="bi bi-chat-heart-fill" id="bleu" onclick="Choix('Tristesse')"><p class="mot">Tristesse</p></i>
            </div>
            <div class="trois">
                <i class="bi bi-chat-heart-fill" id="rouge" onclick="Choix('Colère')"><p class="mot">Colère</p></i>
                <i class="bi bi-chat-heart-fill" id="vert" onclick="Choix('Reconnaissance')"><p class="mot">Reconnaissance</p></i>
            </div>
        </div>
        <div id="texte">[S13:V28] : « N'est-ce point par l'évocation d'Allah que se tranquillisent les cœurs ? »</div>
        <div class="signature">~YZ~</div>
    </div>
    <script src="Muslim.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./service-worker.js")
                    .then(() => {
                        console.log("Lis-moi quand est prête !");
                    })
                    .catch((erreur) => {
                        console.error("Erreur du service worker :", erreur);
                    });
            });
        }
    </script>
</body>
</html>
